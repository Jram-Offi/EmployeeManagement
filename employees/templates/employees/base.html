
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EmployeeHub{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #e8ae24;
            --dark: #172033;
            --sidebar: #172033;
            --body: #f6f7fb;
            --muted: #8992a5;
            --border: #edf0f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--body);
            font-family: Inter, "Segoe UI", sans-serif;
            color: #222b3c;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: var(--sidebar);
            padding: 28px 18px;
            color: white;
            z-index: 1000;
        }

        .brand {
            font-size: 21px;
            font-weight: 750;
            color: white;
            padding: 0 12px;
            margin-bottom: 48px;
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--primary);
            color: #172033;
            display: grid;
            place-items: center;
            font-size: 19px;
        }

        .nav-label {
            color: #8590a6;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 0 13px;
            margin-bottom: 14px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;
            margin-bottom: 7px;
            color: #aeb8c9;
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            transition: .2s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: #29364d;
            color: white;
        }

        .sidebar-link.active {
            border-left: 3px solid var(--primary);
        }

        .sidebar-link i {
            font-size: 17px;
        }

        .sidebar-bottom {
            position: absolute;
            bottom: 25px;
            left: 18px;
            right: 18px;
            padding: 15px;
            border-radius: 12px;
            background: #243149;
        }

        .main-area {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 650;
        }

        .profile-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #fff0c6;
            color: #916300;
            font-weight: 700;
        }

        .content-area {
            max-width: 1500px;
            margin: auto;
            padding: 34px 35px;
        }

        .page-title {
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -.6px;
            color: #202b40;
        }

        .muted {
            color: var(--muted);
        }

        .panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(30, 40, 60, .025);
        }

        .stat-card {
            padding: 22px;
            height: 100%;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            font-size: 20px;
            background: #fff3d5;
            color: #b57b00;
        }

        .employee-card {
            padding: 21px;
            height: 100%;
            transition: .25s;
        }

        .employee-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(30, 40, 60, .08);
        }

        .avatar {
            width: 53px;
            height: 53px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            background: #fff0c6;
            color: #966600;
            font-size: 20px;
            font-weight: 750;
        }

        .employee-name {
            font-size: 15px;
            font-weight: 700;
            color: #253047;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 11px;
            color: #758096;
            font-size: 12px;
            margin-top: 13px;
            overflow-wrap: anywhere;
        }

        .detail-row i {
            font-size: 15px;
            color: #a1aabd;
        }

        .btn-gold {
            background: var(--primary);
            color: #172033;
            border: 1px solid var(--primary);
            border-radius: 9px;
            padding: 10px 17px;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-gold:hover {
            background: #d49b16;
            color: #172033;
        }

        .search-box {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            background: white;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 220px;
            font-size: 13px;
        }

        .action-btn {
            border: 1px solid var(--border);
            background: white;
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .form-control {
            border: 1px solid #e8ebf1;
            border-radius: 9px;
            padding: 11px 13px;
            font-size: 13px;
        }

        .form-control:focus {
            border-color: #e8ae24;
            box-shadow: 0 0 0 3px rgba(232,174,36,.12);
        }

        @media(max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 22px 10px;
            }

            .brand {
                padding: 0;
                justify-content: center;
                font-size: 0;
                margin-bottom: 40px;
            }

            .brand-icon {
                flex-shrink: 0;
            }

            .nav-label,
            .sidebar-link span,
            .sidebar-bottom {
                display: none;
            }

            .sidebar-link {
                justify-content: center;
                padding: 13px 5px;
            }

            .main-area {
                margin-left: 70px;
            }

            .topbar {
                padding: 0 15px;
            }

            .content-area {
                padding: 25px 15px;
            }

            .search-box input {
                width: 130px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<aside class="sidebar">

    <a href="{% url 'dashboard' %}" class="brand">
        <span class="brand-icon"><i class="bi bi-people-fill"></i></span>
        EmployeeHub
    </a>

    <div class="nav-label">MAIN MENU</div>

    <a href="{% url 'dashboard' %}" class="sidebar-link active">
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Dashboard</span>
    </a>

    <a href="{% url 'dashboard' %}" class="sidebar-link">
        <i class="bi bi-person-lines-fill"></i>
        <span>Employees</span>
    </a>

    <a href="{% url 'add_employee' %}" class="sidebar-link">
        <i class="bi bi-person-plus-fill"></i>
        <span>Add Employee</span>
    </a>

    <div class="sidebar-bottom">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-cloud-check-fill text-warning"></i>
            <div>
                <div class="small fw-semibold">EmployeeHub</div>
                <div style="font-size:10px;color:#aeb8c9">Management System</div>
            </div>
        </div>
    </div>

</aside>

<div class="main-area">

    <header class="topbar">
        <div class="topbar-title">
            <i class="bi bi-layout-sidebar-inset me-2 text-secondary"></i>
            Workspace
        </div>

        <div class="d-flex align-items-center gap-3">
            <span class="small muted d-none d-sm-inline">Administrator</span>
            <div class="profile-circle">A</div>
        </div>
    </header>

    <main class="content-area">
        {% block content %}
        {% endblock %}
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
